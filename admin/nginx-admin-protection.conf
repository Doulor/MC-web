# =====================================================================
# nginx-admin-protection.conf —— 参考片段，不会被 nginx 自动加载
#
# 用途：跑 admin/*.php 的那台主机如果是 nginx，把下面几行贴进它的
#       server { ... } 块里，然后：
#           sudo nginx -t && sudo nginx -s reload
#
# 为什么用 return 404 而不是 403：
#   403 = "这里确实有东西"，等于帮扫描器确认目录存在；404 与文件不存在一致。
#
# ⚠️ nginx 的 location 优先级（这就是下面顺序看起来"乱"的原因）：
#   1. =  精确匹配          2. ^~ 前缀匹配（命中后不再看正则）
#   3. ~ / ~* 正则匹配      4. 普通前缀匹配
#   这里全部用普通前缀 + 正则，让"正则 + 更长前缀"能精确压过 /admin/ 的整体认证。
# =====================================================================

# 1) 后台运行时数据直接 404（管理员 bcrypt 哈希 / SMTP 口令 / 访客 PII / 风控状态）
location /admin/data/ {
    return 404;
    access_log off;
}

# 2) 只应被 include 的实现文件，禁止直接请求（正则优先级高于普通前缀）
location ~ ^/admin/(config|handlers|save|smtp)\.php$ {
    return 404;
    access_log off;
}

# 3) 上传目录：禁止目录列表（里面是访客上传的截图）
location /admin/uploads/ {
    autoindex off;
}

# 4) 整个后台再加一道 HTTP Basic Auth —— 这是"后台还能用"的门禁
#    生成口令文件：sudo htpasswd -c /etc/nginx/.htpasswd admin
location /admin/ {
    auth_basic           "restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    autoindex            off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

# ---------------------------------------------------------------------
# 更推荐的做法（不用自己维护 htpasswd，也没有口令爆破面）：
#   把后台单独挂到一个子域（例如 admin.doulor.cn），整站套 Cloudflare Access，
#   Access 在边缘就把未登录用户拦掉了，源站连一个字节都不会暴露。
#   配置入口：Cloudflare Dashboard -> Zero Trust -> Access -> Applications
#             -> Add an application -> Self-hosted
#             Application domain: admin.doulor.cn
#             Policy: Allow, Include -> Emails -> 你自己的邮箱
# ---------------------------------------------------------------------
